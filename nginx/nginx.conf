# nginx.conf — TeachScript reverse proxy
# Routes /api/* to Express backend, everything else to the Vite frontend.
# TLS: place fullchain.pem + privkey.pem in nginx/certs/ (e.g. from certbot).
# If certs are missing the HTTPS server block is skipped and only HTTP runs.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile           on;
  keepalive_timeout  65;
  gzip               on;
  gzip_types         text/plain text/css application/json application/javascript text/xml application/xml;

  # Log to stdout/stderr — picked up by docker json-file driver
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # Hide nginx version from error pages and headers
  server_tokens off;

  # Upstream services (Docker internal DNS)
  upstream backend  { server backend:4000; keepalive 16; }
  upstream frontend { server frontend:80;  keepalive 8;  }

  # HTTP — redirect to HTTPS if certs exist, otherwise serve directly
  server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge path (used for cert renewal)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Redirect to HTTPS only when certs are present
    # Comment out the return line and uncomment the proxy blocks below for HTTP-only setups
    return 301 https://$host$request_uri;

    # --- HTTP-only fallback (uncomment if no TLS) ---
    # location /api/ {
    #   proxy_pass         http://backend;
    #   proxy_set_header   Host              $host;
    #   proxy_set_header   X-Real-IP         $remote_addr;
    #   proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #   proxy_set_header   X-Forwarded-Proto $scheme;
    #   proxy_read_timeout 120s;
    #   client_max_body_size 210m;
    # }
    # location / {
    #   proxy_pass       http://frontend;
    #   proxy_set_header Host $host;
    # }
  }

  # HTTPS — TLS termination
  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — 1 year, include subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # CSP — defence-in-depth for the React SPA.
    # script-src: only same-origin bundles; style-src: allow inline (Tailwind CSS-in-JS);
    # img-src: same-origin + data URIs (avatars) + blob (PDF previews);
    # connect-src: same-origin + backend API origin; frame-ancestors: none (clickjacking).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.teachscript.in; media-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # API — proxy to Express backend
    location /api/ {
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
      # Allow large file uploads (200MB + headroom)
      client_max_body_size 210m;
    }

    # Health endpoints — no auth, used by load balancers
    location /health {
      proxy_pass         http://backend;
      proxy_set_header   X-Real-IP       $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Block /metrics from public internet — only reachable from Docker network
    location /metrics {
      deny all;
    }

    # Frontend — static assets
    location / {
      proxy_pass         http://frontend;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host       $host;
      # Cache-busting: PWA service worker must never be cached
      location ~* \.(?:sw\.js|workbox-.+\.js)$ {
        proxy_pass          http://frontend;
        add_header          Cache-Control "no-cache, no-store, must-revalidate";
      }
    }
  }
}
