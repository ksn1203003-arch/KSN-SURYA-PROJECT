name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  # ── Job 1: Type-check + Unit tests ────────────────────────────────────────────
  unit:
    name: Type-check & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check backend
        working-directory: backend
        run: npx tsc --noEmit

      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Audit backend dependencies (fail on high severity)
        working-directory: backend
        run: npm audit --audit-level=high --omit=dev

      - name: Audit frontend dependencies (fail on high severity)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

      # SAST — eslint-plugin-security catches common Node.js security pitfalls:
      # unsafe regex, insecure randomness, prototype pollution, buffer misuse, etc.
      - name: Install eslint-plugin-security (SAST)
        working-directory: backend
        run: npm install --save-dev eslint@9 @eslint/js eslint-plugin-security

      - name: Run SAST (eslint-plugin-security on backend src/)
        working-directory: backend
        run: |
          npx eslint src/ \
            --rule '{"security/detect-unsafe-regex":"error","security/detect-new-buffer":"error","security/detect-pseudoRandomBytes":"error","security/detect-buffer-noassert":"error","security/detect-object-injection":"warn","security/detect-non-literal-regexp":"warn","security/detect-child-process":"warn","security/detect-possible-timing-attacks":"warn"}' \
            --plugin security \
            --max-warnings 30

      - name: Run backend unit tests
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-at-least-32-characters-long
          MONGODB_URI: "" # MongoMemoryServer handles this in tests
          FRONTEND_URL: http://localhost:5173
        run: npm test

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

  # ── Job 2: Docker image vulnerability scan (Trivy) ───────────────────────────
  trivy:
    name: Trivy Docker Scan
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        working-directory: backend
        run: docker build -t teachscript-backend:ci .

      - name: Scan image for vulnerabilities (CRITICAL + HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "teachscript-backend:ci"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

  # ── Job 3: E2E tests (Playwright) ─────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        # --replSet rs0 mirrors production docker-compose — required so MongoDB
        # multi-document transactions are tested (standalone mode silently degrades).
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --entrypoint "mongod --replSet rs0 --bind_ip_all"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            package-lock.json

      - name: Initialise MongoDB replica set
        run: |
          # Wait for mongod to be ready then initiate the replica set
          timeout 30 bash -c 'until mongosh --quiet --eval "db.adminCommand(\"ping\").ok" 2>/dev/null; do sleep 1; done'
          mongosh --quiet --eval "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }"
          sleep 2

      - name: Install root dependencies (Playwright)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start backend server
        working-directory: backend
        env:
          NODE_ENV: production
          PORT: 4000
          MONGODB_URI: mongodb://localhost:27017/teachscript_e2e
          JWT_SECRET: ci-test-secret-at-least-32-characters-long
          FRONTEND_URL: http://localhost:5173
          BACKEND_URL: http://localhost:4000
          APPROVAL_SECRET: ci-approval-secret-min-32-chars-long
        run: node dist/index.js &

      - name: Start frontend dev server
        working-directory: frontend
        env:
          VITE_BACKEND_URL: http://localhost:4000
        run: npm run dev &

      - name: Wait for servers to be ready
        run: |
          echo "Waiting for backend..."
          timeout 30 bash -c 'until curl -sf http://localhost:4000/health; do sleep 1; done'
          echo "Waiting for frontend..."
          timeout 30 bash -c 'until curl -sf http://localhost:5173; do sleep 1; done'

      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
